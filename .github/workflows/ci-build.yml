name: CI - Build

on:
    push:
        branches: [ main, master ]
        paths:
            - '**.go'
            - 'go.mod'
            - 'go.sum'
            - 'Makefile'
            - '.golangci.yml'
            - '.github/workflows/ci-build.yml'
    pull_request:
        branches: [ main, master ]
        paths:
            - '**.go'
            - 'go.mod'
            - 'go.sum'
            - 'Makefile'
            - '.golangci.yml'
            - '.github/workflows/ci-build.yml'
    workflow_dispatch:

concurrency:
    group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
    cancel-in-progress: true

jobs:
    build:
        name: Build (Go ${{ matrix.go-version }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                go-version: ['1.26.x']
            fail-fast: false

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Go ${{ matrix.go-version }}
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  go-version: ${{ matrix.go-version }}
                  cache: false

            - name: Cache Go modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: |
                      ~/go/pkg/mod
                      ~/.cache/go-build
                  key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('go.sum', 'go.mod') }}
                  restore-keys: |
                      ${{ runner.os }}-go-${{ matrix.go-version }}-

            - name: Verify dependencies
              run: go mod verify

            - name: Download dependencies
              run: go mod download

            - name: Check formatting
              run: make fmt-check

            - name: Run go vet
              run: make vet

            - name: Install golangci-lint
              run: |
                  make lint-install
                  echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

            - name: Run linters
              run: make lint

            - name: Build all packages
              run: make build

            - name: Run tests with coverage
              env:
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
              run: make coverage

            - name: Verify per-file coverage threshold
              run: |
                  awk 'NR > 1 {
                    split($1, a, ":")
                    file = a[1]
                    stmts = $2 + 0
                    cov = $3 + 0
                    total[file] += stmts
                    if (cov > 0) covered[file] += stmts
                  }
                  END {
                    fail = 0
                    for (f in total) {
                      pct = (covered[f] * 100.0) / total[f]
                      printf "%6.2f%%  %s\n", pct, f
                      if (pct < 90.0) {
                        printf "  ✘ %s is below the 90%% per-file coverage target\n", f
                        fail = 1
                      }
                    }
                    exit fail
                  }' coverage.out

            - name: Generate aggregate coverage summary
              run: go tool cover -func=coverage.out | tail -20

            - name: Upload coverage artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: coverage
                  path: |
                      coverage.out
                      coverage.html
                  retention-days: 7
