name: Release

# Publishes a GitHub release when a release tag is pushed.  There is nothing
# to compile: this is a library with no binaries and no external dependencies,
# and GitHub attaches the "Source code" zip and tar.gz archives to every
# release by itself, so the job's only work is to write the release entry and
# give it sensible notes.
#
# A tag carrying a hyphen (v1.0.0-rc1, v1.0.0-beta2, and so on) is published as
# a pre-release; a bare version tag is published as a full release.  The notes
# are lifted from the matching section of docs/changelog.md, so the changelog
# stays the single place release notes are written.

on:
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'
            - 'v[0-9]+.[0-9]+.[0-9]+-*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing tag to publish a release for (e.g. v1.0.0)'
                required: true
                type: string

permissions:
    contents: write

concurrency:
    group: '${{ github.workflow }} @ ${{ inputs.tag || github.ref }}'
    cancel-in-progress: false

jobs:
    release:
        name: Publish GitHub release
        runs-on: ubuntu-latest

        steps:
            - name: Resolve the tag
              id: tag
              env:
                  INPUT_TAG: ${{ inputs.tag }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  tag="${INPUT_TAG:-$REF_NAME}"
                  case "$tag" in
                      v[0-9]*) ;;
                      *)
                          echo "::error::'$tag' is not a release tag; expected a leading 'v' followed by a version."
                          exit 1
                          ;;
                  esac
                  {
                      echo "tag=$tag"
                      echo "version=${tag#v}"
                  } >> "$GITHUB_OUTPUT"
                  # A hyphen marks a pre-release suffix such as -rc1 or -beta2.
                  case "$tag" in
                      *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
                      *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
                  esac

            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ steps.tag.outputs.tag }}

            - name: Extract the release notes from the changelog
              env:
                  VERSION: ${{ steps.tag.outputs.version }}
              run: |
                  set -euo pipefail
                  # Take everything between this version's heading and the next
                  # "## " heading.  A release candidate shares its notes with the
                  # version it is a candidate for, so v1.0.0-rc1 reads the 1.0.0
                  # section.
                  base="${VERSION%%-*}"
                  awk -v want="## [$base]" '
                      index($0, want) == 1 { found = 1; next }
                      found && /^## / { exit }
                      found { print }
                  ' docs/changelog.md > notes.md
                  if [ ! -s notes.md ]; then
                      echo "::error::No changelog section found for $base in docs/changelog.md."
                      exit 1
                  fi
                  echo "Release notes for $base:"
                  cat notes.md

            - name: Create the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.tag.outputs.tag }}
                  PRERELEASE: ${{ steps.tag.outputs.prerelease }}
              run: |
                  set -euo pipefail
                  if gh release view "$TAG" >/dev/null 2>&1; then
                      echo "::notice::A release already exists for $TAG; leaving it alone."
                      exit 0
                  fi
                  args=(--title "$TAG" --notes-file notes.md --verify-tag)
                  if [ "$PRERELEASE" = "true" ]; then
                      args+=(--prerelease)
                  else
                      args+=(--latest)
                  fi
                  gh release create "$TAG" "${args[@]}"
